<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator</title>
    <link rel="stylesheet" href="../../assets/style.css" />
    <!-- <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #ff6, #4a6ee0)
        }
    </style> -->
</head>

<body>
    <div class="container">
        <div class="fixed-width">
            <div class="block white">
                <div class="colors">
                    <input type="color" name="color-a" id="color-a">
                    <input type="color" name="color-b" id="color-b">
                </div>
                <div class="buttons">
                    <button onclick="setDirections('to top', this)">Arrow Up</button>
                    <button class="active" onclick="setDirections('to bottom', this)">Arrow Down</button>
                    <button onclick="setDirections('to right', this)">Arrow right</button>
                    <button onclick="setDirections('to left', this)">Arrow left</button>
                    <button class="rotate" onclick="setDirections('to top right', this)">Arrow top right</button>
                    <button class="rotate" onclick="setDirections('to top left', this)">Arrow top left</button>
                    <button class="rotate" onclick="setDirections('to bottom right', this)">Arrow bottom right</button>
                    <button class="rotate" onclick="setDirections('to bottom left', this)">Arrow bottom left</button>

                </div><br>
                <button class="generate" onclick="generateGradient()">Generate</button>
                <div class="output"><textarea name="" id="code" cols="30" rows="10"></textarea>
                    <button class="copy" onclick="copyCode()">Copy</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js" defer></script>
</body>

</html>
