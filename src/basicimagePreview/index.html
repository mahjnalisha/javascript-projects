<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob Maker</title>
    <link rel="stylesheet" href="../../assets/style.css" />
</head>

<body>
    <div class="container">
        <div class="full-width">
            <div class="block white  ">
                <div class="editor">
                    <div class="filter"><label for="blur">Blur</label> <input type="range" name="blur" id="blur" max="5"
                            min="0" value="2" step="0.2"></div>
                    <div class="filter"><label for="contrast">Contrast</label> <input type="range" name="contrast"
                            id="contrast" max="5" min="0" value="2" step="0.2"></div>
                    <div class="filter"><label for="hue-rotate">Hue Rotate</label> <input type="range" name="hue-rotate"
                            id="hue-rotate" max="360" min="0" value="0"></div>

                    <div class="filter"><label for="sephia">Sephia</label> <input type="range" name="sephia"
                            id="sephaia" max="100" min="0" value="0"></div>
                    <div class="fli-buttons">
                        <div class="flip-option">
                            <input type="radio" name="" id="no-flip" checked>
                            <label>No flip</label>
                        </div>

                        <div class="flip-option">
                            <input type="radio" name="" id="flipx">
                            <label>Flip X axis</label>
                        </div>

                        <div class="flip-option">
                            <input type="radio" name="" id="flipy">
                            <label>Flip Vertical</label>
                        </div>

                    </div>
                </div>
                <div class="result">
                    <figure class="image-preview">
                        <img src="" alt="" id="image-container">
                    </figure>
                    <input type="file" name="upload-btn" id="upload-button" accept="Image/*">
                    <label for="upload-btn">Choose an Image</label>
                    <button id="download-button">Download Image</button>
                </div>



            </div>
        </div>
    </div>
    <script src="index.js" defer></script>
</body>

</html>
