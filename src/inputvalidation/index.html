<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/style.css" />
</head>

<body>
    <div class="container">
        <div class="row">
            <h2>Input text Validation</h2>
        </div>
        <div class="row">

            <div class="block white">


                <form id="myForm">
                    <div id="errorMessage" class="error-message" style="visibility: hidden;">

                    </div>

                </form>
            </div>

        </div>
    </div>
    <script src="index.js" defer></script>
</body>

</html>
