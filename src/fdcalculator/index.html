<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../assets/style.css" />
</head>

<body>
    <div class="container">
        <div class="fixed-width">

            <div class="block white">
                <h2>FD Calculator</h2>
                <div class="form-group">
                    <label>Total Investment</label>
                    <input type="range" name="total_investment" id="investment" min="10000" max="10000000"
                        value="10000">
                    <span id="investment-value">$10,000</span>

                </div>
                <div class="form-group">
                    <label>Rate of Interent</label>
                    <input type="range" name="rate_of_interest" id="interestrate" min="1" max="15" step="0.5"
                        value="6.5%">
                    <span id="range-value">6.5%</span>
                </div>
                <div class="form-group">
                    <label>Time Period</label>
                    <input type="range" name="time_period" id="time_period" min="1" max="20" step="1" value="5">
                    <span id="time-period-value">$10,000</span>
                </div>
                <button onclick="calculayeInteerst()"> Invest Now</button>

            </div>
            <div class="output-section">
                <p>Investment amount <span id="intvestment_am"></span></p>
                <p>Estimated returns <span id="returns"></span></p>
                <p>total Year <span id="total_val"></span></p>
                <p>total amount <span id="total_amount"></span></p>
            </div>

        </div>
    </div>

    <script src="index.js" defer></script>
</body>

</html>
