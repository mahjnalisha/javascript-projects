<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob Maker</title>
    <link rel="stylesheet" href="../../assets/style.css" />
</head>

<body>
    <div class="container">
        <div class="full-width">
            <div class="block white  ">
                <div class="output">
                    <div class="blob"></div>
                </div>

                <div class="dimensions">
                    <div>
                        <label for="blob-height">Height</label>
                        <input type="number" name="blob-height" id="blob-height" value="150">
                    </div>
                    <div>
                        <label for="blob-weight">Weight</label>
                        <input type="number" name="blob-weight" id="blob-weight" value="112">
                    </div>
                </div>
                <div class="sliders">
                    <input type="range" name="" id="" value="30">
                    <input type="range" name="" id="" value="30">
                    <input type="range" name="" id="" value="30">
                    <input type="range" name="" id="" value="30">
                </div>
                <input type="text" name="" id="css-code" readonly>
                <button id="copy">Copy</button>
            </div>
        </div>
    </div>
    <script src="index.js" defer></script>
</body>

</html>
