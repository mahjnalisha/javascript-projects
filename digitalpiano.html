<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Piano Application</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <div class="fixed-width row">
            <div class="piano-container ">
                <h2>Piano app</h2>
                <div class="play_button">
                    <button type="button" onclick="playSound('c')" class="white-key">C</button>
                    <button type="button" onclick="playSound('cc')" class="black-key green">C</button>
                    <button type="button" onclick="playSound('d')" class="white-key">D</button>
                    <button type="button" onclick="playSound('dd')" class="black-key green">DD</button>
                    <button type="button" onclick="playSound('e')" class="white-key">E</button>
                    <button type="button" onclick="playSound('ee')" class="black-key green">EE</button>
                    <button type="button" onclick="playSound('f')" class="white-key">F</button>
                    <button type="button" onclick="playSound('ff')" class="black-key green">FF</button>
                    <button type="button" onclick="playSound('g')" class="white-key">G</button>
                    <button type="button" onclick="playSound('gg')" class="black-key green">GG</button>
                </div>
            </div>
        </div>
    </div>

    <script src="digitalpiano.js" defer></script>
</body>

</html>
