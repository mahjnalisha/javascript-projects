<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password strength Application checker</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <div class="fixed-width">
            <div class="block">
                <h2>Password Strength Checker</h2>
            </div>
            <div class="input-box row">
                <input type="password" placeholder="Enter your password" name="password" id="password_in">
                <button type="button" class="submitButton">Show</button>

            </div>
            <div class="block">
                <p class="message"><span id="strength">Weak</span></p>
            </div>
        </div>
    </div>

    <script src="passwordstrength.js" defer></script>
</body>

</html>
