<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Paragraph Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <div class="fixed-width common-row">
            <div class="block white ">
                <div class="block white">
                    <h2 class="items">Generate Random Paragraph</h2>
                </div>
                <div class="block">
                    <input type="number" name="" id="items">
                </div>
                <div class="block">
                    <button class="generatePara" onClick="generatePara()">Generate</button>
                </div>
            </div>
            <div class="row" id="data">

            </div>
        </div>
    </div>

    <script src="randomparagraph.js" defer></script>
</body>

</html>
